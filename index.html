<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER / NAV ===== -->
  <header class="site-header">
    <div class="logo"></div>
    <nav class="main-nav">
      <button class="nav-link active" data-page="dashboard">Home</button>
      <button class="nav-link" data-page="bookshelf">My Bookshelf</button>
    </nav>
    <div class="user-badge">R</div>
  </header>

  <main>

    <!-- ===== DASHBOARD PAGE ===== -->
    <section id="dashboard" class="page active">

      <div class="welcome-row">
        <h1>Welcome back, Reader!</h1>
        <button class="btn-primary" id="openAddBookBtn">+ Add Book</button>
      </div>

      <div class="stat-row">
        <div class="stat-card">
          <span class="stat-number" id="statBooksRead">0</span>
          <span class="stat-label">Books finished</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statGoalProgress">0 / 25</span>
          <span class="stat-label">Yearly goal</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="statCurrentCount">0</span>
          <span class="stat-label">Currently reading</span>
        </div>
      </div>

      <h2 class="section-title">Currently Reading</h2>
      <div id="currentlyReadingList" class="book-row">
        <!-- filled by JS -->
      </div>

    </section>

    <!-- ===== BOOKSHELF PAGE ===== -->
    <section id="bookshelf" class="page">

      <div class="welcome-row">
        <h1>My Bookshelf</h1>
        <button class="btn-primary" id="openAddBookBtn2">+ Add Book</button>
      </div>

      <div class="tab-row">
        <button class="tab-link active" data-status="current">Current Reads</button>
        <button class="tab-link" data-status="want">Want to Read</button>
        <button class="tab-link" data-status="finished">Finished Books</button>
      </div>

      <p id="shelfCount" class="shelf-count">0 books</p>

      <div id="bookshelfGrid" class="book-grid">
        <!-- filled by JS -->
      </div>

    </section>

  </main>

  <!-- ===== ADD BOOK MODAL ===== -->
  <div id="addBookModal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" data-close="addBookModal">&times;</button>
      <h2>Add a Book</h2>
      <form id="addBookForm">
        <label for="titleInput">Title</label>
        <input type="text" id="titleInput" required placeholder="e.g. The Night Circus">

        <label for="authorInput">Author</label>
        <input type="text" id="authorInput" required placeholder="e.g. Erin Morgenstern">

        <label for="genreInput">Genre</label>
        <input type="text" id="genreInput" placeholder="e.g. Fantasy">

        <label for="pagesInput">Total pages</label>
        <input type="number" id="pagesInput" min="1" required placeholder="e.g. 387">

        <label for="descriptionInput">Description</label>
        <textarea id="descriptionInput" rows="3" placeholder="What's this book about?"></textarea>

        <label for="statusInput">Shelf</label>
        <select id="statusInput">
          <option value="want">Want to Read</option>
          <option value="current">Currently Reading</option>
          <option value="finished">Finished</option>
        </select>

        <button type="submit" class="btn-primary full-width">Add Book</button>
      </form>
    </div>
  </div>

  <!-- ===== BOOK DETAIL MODAL ===== -->
  <div id="bookDetailModal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" data-close="bookDetailModal">&times;</button>

      <span class="detail-genre" id="detailGenre"></span>
      <h2 id="detailTitle"></h2>
      <p class="detail-author" id="detailAuthor"></p>

      <p class="detail-description" id="detailDescription"></p>

      <div id="progressSection" class="progress-section">
        <label for="pageProgressInput">Pages read</label>
        <div class="progress-input-row">
          <input type="number" id="pageProgressInput" min="0">
          <span id="progressOfTotal">/ 0 pages</span>
          <button id="saveProgressBtn" class="btn-secondary">Save</button>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>

      <div id="ratingSection" class="rating-section">
        <p>Rate this book:</p>
        <div class="stars" id="starRating">
          <span data-value="1">&#9733;</span>
          <span data-value="2">&#9733;</span>
          <span data-value="3">&#9733;</span>
          <span data-value="4">&#9733;</span>
          <span data-value="5">&#9733;</span>
        </div>
      </div>

      <div class="detail-actions">
        <select id="moveShelfSelect">
          <option value="want">Want to Read</option>
          <option value="current">Currently Reading</option>
          <option value="finished">Finished</option>
        </select>
        <button id="deleteBookBtn" class="btn-danger">Remove Book</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
